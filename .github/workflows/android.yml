name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build Debug & Release
      run: gradle assembleDebug assembleRelease bundleRelease --stacktrace

    - name: Create Release and Upload APK & AAB
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.ref_name }}-${{ github.run_number }}
        name: Scan to PDF - ${{ github.ref_name }} #${{ github.run_number }}
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/release/app-release.apk
          app/build/outputs/bundle/release/app-release.aab
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
