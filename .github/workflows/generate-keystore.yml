name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Generate Keystore File
        run: |
          keytool -genkeypair -v -keystore smartscan.jks -keyalg RSA -keysize 2048 -validity 10000 -alias smartscan -storepass scan123456 -keypass scan123456 -dname "CN=AI Studio, OU=AI Studio, O=AI Studio, L=SF, S=CA, C=US"
      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartscan-keystore
          path: smartscan.jks
